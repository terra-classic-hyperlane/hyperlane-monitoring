# EasyPanel / Nixpacks build. Node 22 + the pnpm pinned in package.json (via corepack).
[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@11.20.0 --activate",
  "pnpm install --frozen-lockfile",
]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "pnpm start"

[variables]
NEXT_TELEMETRY_DISABLED = "1"
NODE_ENV = "production"
